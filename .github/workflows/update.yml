name: update

on:
  schedule: [{cron: "0 5 * * *"}]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/update.yml"]

permissions: {contents: write, pages: write, id-token: write, issues: write}

concurrency: {group: update, cancel-in-progress: false}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with: {python-version: "3.12", cache: pip}

      - name: Install
        if: github.event_name != 'push'
        run: pip install -e .

      - name: Run tracker
        if: github.event_name != 'push'
        env:
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -m tracker.update
          cat data/run_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add site/data data
          if git commit -m "data: $(date -u +%F)"; then
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "no changes"
          fi

      - name: Notify
        if: github.event_name != 'push' && hashFiles('data/notify.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            python -m tracker.mail data/notify.md
          else
            gh label create new-roles --color DB2777 --description "Daily new-role alerts" --force
            gh issue create --title "New roles $(date -u +%F)" --body-file data/notify.md --label new-roles
          fi

      - uses: actions/upload-pages-artifact@v3
        with: {path: site}

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
