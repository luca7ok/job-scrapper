# Seed config for the job tracker. Generated from research done on 9 Nov 2026.
# ats_companies: slugs taken from real apply links; verify each once (a few may be stale or wrong).
# workday slug format: tenant|wdN|site  ->  POST https://{tenant}.{wdN}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs

settings:
  include_turkey: false
  arbeitnow_pages: 10
  aggregators:
    arbeitnow: true
    adzuna: true

# Title regexes (case-insensitive). Edit these to tune what counts as an entry-level SWE role.
filters:
  swe_strong: 'software (engineer|dev)|developer|\bSWE\b|\bSDE\b|full[- ]?stack|back[- ]?end|front[- ]?end|site reliability|forward deployed'
  swe_broad: 'programm(er|ier|ing)|programist|programator|platform eng|infrastructure eng|cloud eng|mobile|\bios\b|android|web eng|application (dev|eng)|systems eng|developpeur|développeur|entwickl|informatik|machine learning eng|\bML eng|\bAI eng|security eng|test eng|\bQA\b|automation eng|devops|mlops|data eng|\bgame|gameplay|tools eng|compiler|embedded software|firmware|engineering intern|graduate engineer'
  swe_strong_exclude: 'process developer|business develop|finance and accounting|developer relations manager'
  swe_broad_exclude: 'mechanical|electrical|electronic|elektronik|elektrotechnik|mechanik|maschinenbau|civil|structural|chemical|process eng|manufactur|hardware|silicon|asic|\brtl\b|analog|\bRF\b|\bsales\b|\baccount|marketing|finance|\baudit|\btax\b|\blegal\b|\bHR\b|trader|quantitative research|research scientist|aerospace|biomed|clinical|supply chain|procurement|logistics|consult(ant|ing)|business analyst|product manag|design verification|physical design|validation eng|optical|photonic|materials|environmental'
  always_exclude: 'apprentic|duales studium|unsolicited|spontaneous application|candidature spontan|initiativbewerbung|uopfordret|talent pool|talent community|dual(es)? studium|werkstudent|working student|\b(senior|sr\.?|staff|principal|lead|manager|director|head of|III|IV|experienced|architect)\b|fpga|layout'
  intern: '\bintern\b|\binterns\b|internship|\bstage\b|stagiaire|praktik|stagiu|\bsummer\b|placement|\bco-?op\b|tirocinio|\bbeca\b|becario|staż|\bstaz\b'
  new_grad: 'graduate|new grad|\bjunior\b|\bjr\.?\b|\bentry\b|entry[- ]level|early career|associate software|academy|trainee|\bprogram(me)?\b|absolvent|berufseinsteiger|\bjeune diplom'
  phd: '\bph\.?d\b|doctoral|\bdoktorand'
  drop_years: '\b(2024|2025)\b|(summer|spring|winter|fall|autumn)\s*2026|2026\s*(start|intern)'

